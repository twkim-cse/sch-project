services:
  ai:
    build: ./ai
    ports:
      - "8001:8001"
    environment:
      - AI_MODEL_API_KEY=${AI_MODEL_API_KEY:-}

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - AI_BASE_URL=http://ai:8001
    depends_on:
      - ai

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # docker 안에서는 프록시 대상이 backend 컨테이너가 되어야 한다.
      - PROXY_TARGET=http://backend:8080
    depends_on:
      - backend
