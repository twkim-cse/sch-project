services:
  ai:
    build: ./ai
    ports:
      - "8001:8001"
    environment:
      - AI_MODEL_API_KEY=${AI_MODEL_API_KEY:-}

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - AI_BASE_URL=http://ai:8001
      # 기본값 true: 실제 약관 없이도 프론트가 화면을 만들 수 있도록 문서 API가
      # 명세서 예시 고정 결과를 돌려준다. .env에서 false로 바꾸면 실제 분석을 한다.
      - MOCK_DOCUMENTS=${MOCK_DOCUMENTS:-true}
    depends_on:
      - ai

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # docker 안에서는 프록시 대상이 backend 컨테이너가 되어야 한다.
      - PROXY_TARGET=http://backend:8080
    depends_on:
      - backend
